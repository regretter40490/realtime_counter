<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム共有カウンター</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f9;
        }
        h1 {
            font-size: 2.5rem;
            color: #333;
        }
        #counter {
            font-size: 6rem;
            font-weight: bold;
            color: #4f46e5;
            margin: 20px 0;
        }
        button {
            font-size: 1.5rem;
            padding: 15px 30px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        button:hover {
            background-color: #4338ca;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>リアルタイム共有カウンター</h1>
    <div id="counter">読み込み中...</div>
    <button id="increment-btn">+1 ボタン</button>

    <!-- Firebaseのスクリプト読み込み (モジュール版) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAl6rqDbJGiSBwraxkicINIZxx1OZYoCMs",
  authDomain: "sampleproject002-8f10f.firebaseapp.com",
  projectId: "sampleproject002-8f10f",
  storageBucket: "sampleproject002-8f10f.firebasestorage.app",
  messagingSenderId: "794183437110",
  appId: "1:794183437110:web:40be924f9b735615714197",
  measurementId: "G-V49437G1GC"
};

        // Firebase初期化
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Firestoreのドキュメントを指定 (countersコレクションの適当なID)
        // ※ステップ1で作ったドキュメントの自動生成IDをここに記述してください
        const docRef = doc(db, "counters", "FFOICvIfFGHsSAHSACgS");

        const counterElement = document.getElementById("counter");
        const buttonElement = document.getElementById("increment-btn");

        // 1. リアルタイムでデータを監視・同期する
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                counterElement.textContent = data.count;
            } else {
                counterElement.textContent = "データがありません";
            }
        });

        // 2. ボタンを押したときの処理（アトミックな加算）
        buttonElement.addEventListener("click", async () => {
            try {
                // increment(1)を使うことで、複数人が同時に押しても競合せず正確に加算されます
                await updateDoc(docRef, {
                    count: increment(1)
                });
            } catch (error) {
                console.error("エラーが発生しました: ", error);
            }
        });
    </script>
</body>
</html>
